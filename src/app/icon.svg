<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#7A1F2A" />
      <stop offset="100%" stop-color="#4A0A10" />
    </radialGradient>
    
    <!-- Gold Gradient for initials and borders -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="50%" stop-color="#C8A24C" />
      <stop offset="100%" stop-color="#9C7A2E" />
    </linearGradient>
    
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer circular background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner ornate dotted ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.8" />

  <!-- Monogram Initials "A & M" -->
  <g filter="url(#shadow)">
    <text x="175" y="320" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-size="190" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">A</text>
    
    <text x="256" y="275" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="95" font-style="italic" fill="#FFEFA6" text-anchor="middle" opacity="0.95">&amp;</text>
    
    <text x="335" y="320" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-size="190" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">M</text>
  </g>
  
  <!-- Small traditional flower/star at top and bottom -->
  <text x="256" y="110" font-family="serif" font-size="28" fill="url(#goldGrad)" text-anchor="middle">❁</text>
  <text x="256" y="425" font-family="serif" font-size="28" fill="url(#goldGrad)" text-anchor="middle">❁</text>
</svg>
